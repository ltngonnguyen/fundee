[project]
name = "fundee"
version = "0.2.0"
description = "Hyperliquid perpetual-futures funding-rate arbitrage bot (ccxt-backed)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "textual>=0.50",
    "rich>=13.0",
    "ccxt>=4.2.0",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "coverage>=7.0",
    "ruff>=0.5",
]

[project.scripts]
fundee = "fundee:main"
fundee-analyze = "analyze_trades:main"
fundee-dryrun = "fundee_dryrun:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["test_units.py", "test_suite.py"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["fundee", "fundee_shared"]
omit = ["test_*", "analyze_trades.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]
